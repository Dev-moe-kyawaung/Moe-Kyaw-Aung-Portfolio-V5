# ================================================================
# GitHub Actions — Auto Deploy to GitHub Pages
# Repo: Moe-Kyaw-Aung-portfolio-V5
# Author: Moe Kyaw Aung
# ================================================================

name: Deploy Portfolio to GitHub Pages

on:
  # Trigger on every push to main branch
  push:
    branches:
      - main
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

# Grant write permissions to deploy GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Cancel in-progress runs when a new push comes in
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ── Job 1: Build ──────────────────────────────────────────────
  build:
    name: Build Portfolio
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Validate HTML
        run: |
          echo "✅ Validating portfolio HTML structure..."
          if [ -f "moe-kyaw-aung-portfolio-v5.html" ]; then
            echo "✅ Main portfolio file found: moe-kyaw-aung-portfolio-v5.html"
            FILESIZE=$(wc -c < "moe-kyaw-aung-portfolio-v5.html")
            echo "📄 File size: ${FILESIZE} bytes"
          else
            echo "❌ ERROR: moe-kyaw-aung-portfolio-v5.html not found!"
            exit 1
          fi

      - name: 📋 List repository contents
        run: |
          echo "📁 Repository structure:"
          find . -not -path './.git/*' -not -path './node_modules/*' | head -50

      - name: 🏗️ Setup deployment directory
        run: |
          mkdir -p _site
          # Copy main portfolio file
          cp moe-kyaw-aung-portfolio-v5.html _site/index.html
          cp moe-kyaw-aung-portfolio-v5.html _site/moe-kyaw-aung-portfolio-v5.html
          # Copy assets if they exist
          [ -d "assets" ] && cp -r assets _site/ || true
          [ -f "README.md" ] && cp README.md _site/ || true
          echo "✅ Site directory prepared"
          ls -la _site/

      - name: ⚙️ Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: 📦 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  # ── Job 2: Deploy ─────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 🎉 Deployment complete
        run: |
          echo "================================================"
          echo "✅ Portfolio V5 deployed successfully!"
          echo "🌐 Live URL: ${{ steps.deployment.outputs.page_url }}"
          echo "👤 Developer: Moe Kyaw Aung"
          echo "📍 Location: Tachileik, Myanmar"
          echo "================================================"
